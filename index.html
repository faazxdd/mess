<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Mess Manager">
<meta name="theme-color" content="#291447"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Mess Manager</title>
<style>
:root{--n:#EDE5FF;--g:#4ADE80;--r:#FB7185;--bg:#160D2B;--b:#493365;--surface:#291447;--primary:#7138B8;--accent:#B99AFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{font:16px 'Plus Jakarta Sans',-apple-system,Helvetica,Arial,sans-serif;background:linear-gradient(145deg,#160D2B 0%,#21113D 45%,#321957 100%);background-attachment:fixed;color:var(--n);padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom))}
header{background:linear-gradient(110deg,#291447 0%,#55258E 55%,#8955D9 100%);color:#fff;padding:17px 16px;font-weight:700;font-size:20px;box-shadow:0 4px 18px #0003}
main{padding:14px;max-width:600px;margin:auto}
.card{background:linear-gradient(145deg,#291447,#211137);border:1px solid #493365;border-radius:18px;padding:15px;margin:0 0 13px;box-shadow:0 5px 18px #0003}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{font-size:12px;color:#C2A9E9;text-transform:uppercase;letter-spacing:.05em}
.v{font-size:20px;font-weight:700;margin-top:3px;word-break:break-word;color:#F5F0FF}
.pos{color:#4ADE80}.neg{color:#FB7185}
h3{margin:4px 0 12px;font-size:17px;color:#E9D5FF}
input,select,textarea{width:100%;font:16px 'Plus Jakarta Sans',-apple-system,Helvetica,Arial,sans-serif;padding:13px;border:1px solid #594078;border-radius:12px;background:#1C1030;color:#F5F0FF;margin:4px 0 12px;color-scheme:dark}
input:focus,select:focus,textarea:focus{outline:2px solid #A78BFA;border-color:#A78BFA}
input::placeholder,textarea::placeholder{color:#9D8BB5}
label{font-size:13px;font-weight:600;color:#D8C2F8}
button{font:600 16px 'Plus Jakarta Sans',-apple-system,Helvetica,Arial,sans-serif;border:0;border-radius:12px;padding:14px;background:linear-gradient(120deg,#55258E,#8955D9);color:#fff;min-height:48px;box-shadow:0 3px 10px #0002}
button:active{transform:scale(.98);opacity:.9}
button.big{width:100%;font-size:18px;background:linear-gradient(110deg,#7138B8,#A477ED);min-height:56px}
button.alt{background:#392451;color:#E9D5FF;border:1px solid #594078}
button.del{background:linear-gradient(110deg,#BE3455,#E05275)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.row>*{min-width:0}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}
.pay label{display:block}.pay input{display:none}
.pay span{display:block;text-align:center;padding:13px 4px;border:1px solid #594078;border-radius:12px;font-weight:700;color:#D8C2F8;background:#211137}
.pay input:checked+span{background:linear-gradient(120deg,#7138B8,#A477ED);color:#fff;border-color:#B99AFF}
.bar{height:14px;background:#392451;border-radius:7px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7138B8,#B99AFF);border-radius:7px}
.cols{display:flex;align-items:flex-end;gap:6px;height:110px}
.cols div{flex:1;text-align:center;font-size:10px;color:#D8C2F8}
.cols i{display:block;background:linear-gradient(180deg,#B99AFF,#7138B8);border-radius:6px 6px 0 0;min-height:2px}
.inv{padding:12px 0;border-bottom:1px solid #493365}.inv:last-child{border:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:linear-gradient(100deg,#1B1030,#291447);border-top:1px solid #493365;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -5px 20px #0004;z-index:5}
nav button{flex:1;background:none;box-shadow:none;color:#A995C3;font-size:11px;padding:8px 2px;min-height:56px}
nav button.on{color:#C4A5FF;font-weight:800;background:#43207855}
nav b{display:block;font-size:20px}
#md{position:fixed;inset:0;background:#10071BCC;display:none;align-items:flex-end;z-index:9}
#md>div{background:linear-gradient(145deg,#291447,#160D2B);border:1px solid #493365;color:#F5F0FF;width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
img.rc{max-width:100%;border-radius:12px;margin:8px 0}
.sm{font-size:13px;color:#B9A5D2}
.sc{padding:10px 12px;border-radius:12px;margin-bottom:10px;background:#291447;border-left:5px solid}
.neg2{border-color:#FB7185}.pos2{border-color:#4ADE80}
@media print{nav,header,.np{display:none!important}body{background:#fff;color:#111;padding:0}.card{background:#fff;color:#111}}
body{-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;letter-spacing:-.005em}
header{letter-spacing:.01em}h3{font-weight:700;letter-spacing:-.01em}.v{font-weight:800;letter-spacing:-.02em}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
@keyframes grow{from{width:0}}@keyframes rise{from{transform:scaleY(0)}}
main>*{animation:up .38s cubic-bezier(.2,.7,.2,1) both}
main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}main>*:nth-child(4){animation-delay:.12s}main>*:nth-child(5){animation-delay:.16s}
button{transition:transform .12s ease,opacity .12s,filter .12s}
button:active{transform:scale(.95);filter:brightness(1.15)}
.inv{transition:background .15s}.inv:active{background:#ffffff0d}
nav button.on svg{animation:pop .35s}
#md>div{animation:sheet .28s cubic-bezier(.2,.8,.2,1)}
.bar i{animation:grow .7s ease}.cols i{animation:rise .7s ease;transform-origin:bottom}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#7138B8;color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;box-shadow:0 6px 20px #0006}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gw" x1="3" y1="3" x2="21" y2="21" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dcd6f7"/></linearGradient><filter id="dsh" x="-2" y="-2" width="28" height="28" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity=".3"/></filter></defs></svg>
<header>💰 Mess Manager <span class="sm" style="color:#9fb3d1;font-weight:400">AED</span></header>
<main id="app"></main><div id="md"><div id="mc"></div></div>
<div class="np" style="text-align:center;padding:0 14px 14px"><button class="alt" onclick="document.getElementById('introMusic').play()">🎵 Play Music</button></div>
<audio id="introMusic" src="intro.mp3" preload="auto"></audio>
<div id="toast"></div>
<nav>
<button data-v="dash"><svg width="24" height="24" viewBox="0 0 24 24"><g filter="url(#dsh)" fill="url(#gw)"><rect x="3" y="3" width="8" height="8" rx="2.5"/><rect x="13" y="3" width="8" height="8" rx="2.5"/><rect x="3" y="13" width="8" height="8" rx="2.5"/><rect x="13" y="13" width="8" height="8" rx="2.5"/></g></svg>Dashboard</button>
<button data-v="add"><svg width="24" height="24" viewBox="0 0 24 24"><g filter="url(#dsh)"><circle cx="12" cy="12" r="10" fill="url(#gw)"/><path d="M12 7v10M7 12h10" stroke="#160d2b" stroke-width="2.2" stroke-linecap="round"/></g></svg>Add</button>
<button data-v="hist"><svg width="24" height="24" viewBox="0 0 24 24"><g filter="url(#dsh)" fill="url(#gw)"><path fill-rule="evenodd" clip-rule="evenodd" d="M5 2l1.75 1.25L8.5 2l1.75 1.25L12 2l1.75 1.25L15.5 2l1.75 1.25L19 2v20l-1.75-1.25L15.5 22l-1.75-1.25L12 22l-1.75-1.25L8.5 22l-1.75-1.25L5 22V2zm3 5h5v2H8V7zm7 0h1v2h-1V7zm-7 4h5v2H8v-2zm7 0h1v2h-1v-2zm-7 4h5v2H8v-2zm7 0h1v2h-1v-2z"/></g></svg>History</button>
<button data-v="set"><svg width="24" height="24" viewBox="0 0 24 24"><g filter="url(#dsh)"><rect x="2" y="2" width="20" height="20" rx="6" fill="url(#gw)"/><path d="M10 13l-1.5-1.5a1.2 1.2 0 0 1 0-1.7l1.7-1.7a1.2 1.2 0 0 1 1.7 0l1 1m-3 4l2 2a1.2 1.2 0 0 0 1.7 0l2-2a1.2 1.2 0 0 0 0-1.7l-2-2m-3.5 3.5l-1.2 1.2m5-5l1.2-1.2" stroke="#160d2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></svg>Settle</button>
<button data-v="rep"><svg width="24" height="24" viewBox="0 0 24 24"><g filter="url(#dsh)" fill="url(#gw)"><rect x="4" y="11" width="4" height="9" rx="1.5"/><rect x="10" y="5" width="4" height="15" rx="1.5"/><rect x="16" y="9" width="4" height="11" rx="1.5"/></g></svg>Reports</button>
</nav>
<script>
const M=['FAZAL','NIYAS','SHAMIL','FASAL'],$=s=>document.querySelector(s);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let db,all=[],mon=today().slice(0,7),view='dash',edit=null,F={q:'',m:'',mo:'',d:''};
const f=n=>(n/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tx=m=>db.transaction('inv',m).objectStore('inv');
const rq=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const load=async()=>{all=await rq(tx('readonly').getAll());all.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)};
function calc(l){const p=[0,0,0,0];l.forEach(i=>p[i.payer]+=i.amt);const t=p.reduce((a,b)=>a+b,0),b=Math.floor(t/4),r=t%4;
const sh=p.map((_,i)=>b+(i<r?1:0)),bal=p.map((x,i)=>x-sh[i]),d=[],c=[],tr=[];
bal.forEach((x,i)=>x<0?d.push([i,-x]):x>0&&c.push([i,x]));
while(d.length&&c.length){d.sort((a,b)=>b[1]-a[1]);c.sort((a,b)=>b[1]-a[1]);const m=Math.min(d[0][1],c[0][1]);tr.push({from:d[0][0],to:c[0][0],amt:m});d[0][1]-=m;c[0][1]-=m;if(!d[0][1])d.shift();if(!c[0][1])c.shift()}
return{p,t,sh,bal,tr,n:l.length}}
const inM=m=>all.filter(i=>i.date.startsWith(m));
const mb=()=>`<div class="np"><label>Month</label><input type="month" value="${mon}" onchange="mon=this.value||mon;go()"></div>`;
const bal=x=>x===0?'<span class="sm">Balanced ✅</span>':x<0?`<span class="neg">🔴 Owes · AED ${f(-x)}</span>`:`<span class="pos">🟢 Gets back · AED ${f(x)}</span>`;
const settle=c=>{const by={};c.tr.forEach(x=>(by[x.from]=by[x.from]||[]).push(x));
const pay=Object.keys(by).map(i=>{const l=by[i],t=l.reduce((a,x)=>a+x.amt,0);return `<div class="sc neg2"><div class="row"><b>${M[i]}</b><b class="neg">AED ${f(t)}</b></div><div class="sm">Pays to 👇</div>${l.map(x=>`<div class="row"><span>➡️ ${M[x.to]}</span><b>AED ${f(x.amt)}</b></div>`).join('')}</div>`}).join('');
const get=c.bal.map((x,i)=>x>0?`<div class="sc pos2"><div class="row"><b>${M[i]}</b><b class="pos">AED ${f(x)}</b></div><div class="sm">Total to receive</div></div>`:'').join('');
return c.tr.length?`<h3>🔴 Need to pay</h3>${pay}<h3>🟢 Will receive</h3>${get}`:'<p class="sm">All settled ✅ Nobody owes anyone.</p>'};
function shr(){const c=calc(inM(mon));let s=`🧾 Mess ${mon}\nTotal expenses: AED ${f(c.t)}\nEqual share: AED ${f(c.t/4)}\n\n`;M.forEach((n,i)=>s+=`${n}: Paid AED ${f(c.p[i])}\n`);s+='\n';c.tr.forEach(t=>s+=`${M[t.from]} ➡️ ${M[t.to]}: AED ${f(t.amt)}\n`);navigator.share?navigator.share({text:s}).catch(()=>{}):location.href='https://wa.me/?text='+encodeURIComponent(s)}
function dash(){const c=calc(inM(mon)),mx=Math.max(...c.p,1);
const ms=[...Array(6)].map((_,k)=>{const d=new Date(+mon.slice(0,4),+mon.slice(5)-6+k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}),mt=ms.map(x=>calc(inM(x)).t),mm=Math.max(...mt,1);
return mb()+`<div class="grid"><div class="card"><div class="k">Total expenses</div><div class="v">AED ${f(c.t)}</div></div><div class="card"><div class="k">Invoices</div><div class="v">${c.n}</div></div><div class="card"><div class="k">Equal share</div><div class="v">AED ${f(c.t/4)}</div></div><div class="card"><div class="k">Members</div><div class="v">4</div></div></div>
<div class="card"><h3>Spending by member</h3>${M.map((n,i)=>`<div class="row"><b>${n}</b><span>AED ${f(c.p[i])}</span></div><div class="bar"><i style="width:${c.p[i]/mx*100}%"></i></div>`).join('')}</div>
<div class="card"><h3>Who gets and who owes</h3>${M.map((n,i)=>`<div class="row inv"><b>${n}</b>${bal(c.bal[i])}</div>`).join('')}</div>
<div class="card"><h3>Last 6 months</h3><div class="cols">${ms.map((x,i)=>`<div><span>${mt[i]?f(mt[i]).replace(/\.00$/,''):''}</span><i style="height:${mt[i]/mm*80}px;${x===mon?'background:#B99AFF':''}"></i>${'JanFebMarAprMayJunJulAugSepOctNovDec'.substr((+x.slice(5)-1)*3,3)}</div>`).join('')}</div></div>`}
const CATS=['Groceries','Vegetables & Fruits','Meat & Fish','Cleaning','Gas & Utilities','Other'];
function add(){const o=edit?all.find(i=>i.id===edit):{date:today(),payer:-1};
return `<div class="card"><h3>${edit?'Edit':'New'} invoice</h3>
<label>Purchase date</label><input id="dt" type="date" value="${o.date}">
<label>Shop name</label><input id="shop" value="${e(o.shop)}" placeholder="e.g. Lulu Hypermarket">
<label>Invoice number</label><input id="no" value="${e(o.no)}">
<label>Description</label><input id="ds" value="${e(o.desc)}" placeholder="Groceries, cleaning...">
<label>Category</label><select id="ct">${CATS.map(c=>`<option ${o.cat===c?'selected':''}>${c}</option>`).join('')}</select>
<label>Amount (AED)</label><input id="amt" type="number" inputmode="decimal" step="0.01" min="0" value="${o.amt?(o.amt/100).toFixed(2):''}">
<label>Paid by</label><div class="pay">${M.map((n,i)=>`<label><input type="radio" name="pp" value="${i}" ${o.payer===i?'checked':''}><span>${n}</span></label>`).join('')}</div>
<label>Invoice photo ${o.photo?'(saved; choose to replace)':''}</label><input id="ph" type="file" accept="image/*">
<label>Notes (optional)</label><textarea id="nt" rows="2">${e(o.notes)}</textarea>
<button class="big" onclick="save()">SAVE INVOICE</button>${edit?'<button class="alt" style="width:100%;margin-top:10px" onclick="edit=null;go()">Cancel edit</button>':''}</div>`}
async function save(){const g=i=>$('#'+i).value.trim(),a=Math.round(Number(g('amt'))*100),p=document.querySelector('input[name=pp]:checked');
if(!g('dt')||!g('shop')||!(a>0)||!p)return alert('Please enter date, shop, an amount above 0, and who paid.');
const o=edit?{...all.find(i=>i.id===edit)}:{};Object.assign(o,{date:g('dt'),shop:g('shop'),no:g('no'),desc:g('ds'),amt:a,payer:+p.value,notes:g('nt'),cat:$('#ct').value});
const fl=$('#ph').files[0];if(fl)o.photo=fl;
try{await rq(tx('readwrite').put(o))}catch(x){return alert('Save failed: '+x)}
edit=null;mon=o.date.slice(0,7);await load();view='hist';F={q:'',m:'',mo:mon,d:''};go();toast('Invoice saved ✓')}
function hist(){let l=all.filter(i=>(!F.m||i.payer==F.m)&&(!F.mo||i.date.startsWith(F.mo))&&(!F.d||i.date===F.d)&&(!F.q||[i.shop,i.no,i.desc,i.notes].join(' ').toLowerCase().includes(F.q.toLowerCase())));
return `<div class="card np"><input placeholder="🔍 Search shop, invoice, notes" value="${e(F.q)}" oninput="F.q=this.value;hl()">
<select onchange="F.m=this.value;go()"><option value="">All members</option>${M.map((n,i)=>`<option value="${i}" ${F.m==i&&F.m!==''?'selected':''}>${n}</option>`).join('')}</select>
<label>Month</label><input type="month" value="${F.mo}" onchange="F.mo=this.value;go()"><label>Exact date</label><input type="date" value="${F.d}" onchange="F.d=this.value;go()">
<button class="alt" onclick="F={q:'',m:'',mo:'',d:''};go()">Clear filters</button></div><div class="card" id="hl">${hrows(l)}</div>`}
const hrows=l=>l.length?`<div class="sm">${l.length} invoices · AED ${f(l.reduce((a,b)=>a+b.amt,0))}</div>`+l.map(i=>`<div class="inv" onclick="show(${i.id})"><div class="row"><b>${e(i.shop)}</b><b>AED ${f(i.amt)}</b></div><div class="sm">${i.date} · ${M[i.payer]}${i.cat?' · '+e(i.cat):''}${i.photo?' · 📷':''}</div></div>`).join(''):'<p class="sm">No invoices found.</p>';
function hl(){const x=F;$('#hl').innerHTML=hrows(all.filter(i=>(!x.m||i.payer==x.m)&&(!x.mo||i.date.startsWith(x.mo))&&(!x.d||i.date===x.d)&&(!x.q||[i.shop,i.no,i.desc,i.notes].join(' ').toLowerCase().includes(x.q.toLowerCase()))))}
function show(id){const i=all.find(x=>x.id===id);$('#mc').innerHTML=`<h3>${e(i.shop)}</h3><div class="v">AED ${f(i.amt)}</div><p>Date: ${i.date}<br>Paid by: <b>${M[i.payer]}</b><br>Invoice no: ${e(i.no)||'-'}<br>Description: ${e(i.desc)||'-'}<br>Notes: ${e(i.notes)||'-'}</p>${i.photo?`<img class="rc" src="${URL.createObjectURL(i.photo)}">`:''}
<div class="grid"><button onclick="edit=${id};view='add';cm();go()">Edit</button><button class="del" onclick="del(${id})">Delete</button></div><button class="alt" style="width:100%;margin-top:10px" onclick="cm()">Close</button>`;$('#md').style.display='flex'}
const cm=()=>$('#md').style.display='none';
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)};
async function del(id){if(!confirm('Delete this invoice permanently? Export a backup first if unsure.'))return;await rq(tx('readwrite').delete(id));await load();cm();go();toast('Invoice deleted')}
function set(){const c=calc(inM(mon));return mb()+`<div class="card"><div class="k">Total expenses</div><div class="v">AED ${f(c.t)}</div><div class="sm">Total ÷ 4 = equal share: AED ${f(c.t/4)}</div></div><div class="card"><h3>Who pays whom</h3>${settle(c)}</div><button class="big np" onclick="shr()">📄 Share PDF invoice</button>`}
function rep(){const c=calc(inM(mon));return mb()+`<div class="card"><h3>Report: ${mon}</h3><div class="row"><span>Total expenses</span><b>AED ${f(c.t)}</b></div><div class="row"><span>Invoices</span><b>${c.n}</b></div><div class="row"><span>Equal share</span><b>AED ${f(c.t/4)}</b></div></div>
<div class="card"><h3>Everyone</h3>${M.map((n,i)=>`<div class="inv"><b>${n}</b><div class="sm">Paid AED ${f(c.p[i])} · Share AED ${f(c.sh[i])}</div>${bal(c.bal[i])}</div>`).join('')}</div>
<div class="card"><h3>Settlement</h3>${settle(c)}</div>
<div class="card np"><h3>Export &amp; backup</h3><button style="width:100%;margin-bottom:8px" onclick="window.print()">🖨 Print report</button><button style="width:100%;margin-bottom:8px" onclick="csv()">Export all to CSV (Excel)</button><button style="width:100%;margin-bottom:8px" onclick="bk()">Download full JSON backup</button><label>Restore from backup</label><input type="file" accept=".json,application/json" onchange="rs(this.files[0])"></div>`}
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.append(a);a.click();a.remove()};
const rd=b=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(b)});
function csv(){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';dl(new Blob(['\ufeff'+['Date,Shop,Invoice No,Description,Amount AED,Paid By,Notes,Category',...all.map(i=>[i.date,q(i.shop),q(i.no),q(i.desc),(i.amt/100).toFixed(2),M[i.payer],q(i.notes),q(i.cat)].join(','))].join('\r\n')],{type:'text/csv'}),'mess-expenses.csv')}
async function bk(){const o=[];for(const i of all){const x={...i};if(i.photo)x.photo=await rd(i.photo);o.push(x)}dl(new Blob([JSON.stringify({app:'mess-manager',v:1,data:o})],{type:'application/json'}),'mess-backup-'+today()+'.json')}
async function rs(file){if(!file)return;try{const j=JSON.parse(await file.text());if(j.app!=='mess-manager')throw 0;
if(!confirm('Replace ALL current data with this backup ('+j.data.length+' invoices)? Download a backup first if unsure.'))return;
const rec=[];for(const i of j.data){if(typeof i.photo==='string')i.photo=await (await fetch(i.photo)).blob();rec.push(i)}
const t=db.transaction('inv','readwrite'),s=t.objectStore('inv');s.clear();rec.forEach(i=>s.put(i));await new Promise((a,b)=>{t.oncomplete=a;t.onerror=()=>b(t.error)});await load();alert('Restored.');go()}catch(x){alert('Invalid backup file. Nothing was changed.')}}
function go(v){if(v){view=v;if(v!=='add')edit=null}$('#app').innerHTML={dash,add,hist,set,rep}[view]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#md').onclick=ev=>{if(ev.target.id==='md')cm()};
const o=indexedDB.open('mess-manager',1);o.onupgradeneeded=()=>o.result.createObjectStore('inv',{keyPath:'id',autoIncrement:true});
o.onsuccess=async()=>{db=o.result;await load();go();navigator.storage?.persist?.()};o.onerror=()=>alert('Storage unavailable. Do not use Private Browsing.');
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
